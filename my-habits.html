<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Habits - Habit Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .sidebar { min-height: calc(100vh - 56px); background: #ffffff; border-right: 1px solid #e9ecef; }
    .sidebar .nav-link { color: #495057; font-weight: 500; padding: 12px 20px; }
    .sidebar .nav-link.active { background: #eef2ff; color: #4361ee; border-radius: 6px; }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-square-check text-primary me-2"></i>HT Habit Tracker</a>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar Navigation -->
      <div class="col-md-3 col-lg-2 sidebar p-3">
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-house me-2"></i>Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="my-habits.html"><i class="fa-solid fa-list-check me-2"></i>My Habits</a></li>
          <li class="nav-item"><a class="nav-link" href="add-habit.html"><i class="fa-solid fa-circle-plus me-2"></i>Add Habit</a></li>
          <li class="nav-item"><a class="nav-link" href="progress.html"><i class="fa-solid fa-chart-pie me-2"></i>Progress</a></li>
          <li class="nav-item mt-4"><a class="nav-link text-danger" href="index.html"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</a></li>
        </ul>
      </div>

      <!-- Main Content Area -->
      <div class="col-md-9 col-lg-10 p-4">
        <h3 class="fw-bold mb-3">Manage Habits</h3>

        <!-- Search and Filter Controls -->
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control" placeholder="Search Habits..." oninput="loadHabits()">
          </div>
          <div class="col-md-4">
            <select id="filterType" class="form-select" onchange="loadHabits()">
              <option value="All">All Types</option>
              <option value="Good">Good Habits</option>
              <option value="Bad">Bad Habits</option>
            </select>
          </div>
          <div class="col-md-2">
            <a href="add-habit.html" class="btn btn-primary w-100"><i class="fa-solid fa-plus me-1"></i> Add Habit</a>
          </div>
        </div>

        <!-- Habits Table -->
        <div class="card border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Habit</th>
                  <th>Type</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="habitTableBody">
                <!-- Dynamically rendered rows -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Initial default habits if none exist in browser storage
    const defaultHabits = [
      { id: 1, name: 'Drink water', type: 'Good' },
      { id: 2, name: 'Exercise', type: 'Good' },
      { id: 3, name: 'Read book', type: 'Good' },
      { id: 4, name: 'Smoking', type: 'Bad' },
      { id: 5, name: 'Junk Food', type: 'Bad' },
      { id: 6, name: 'Social Media', type: 'Bad' }
    ];

    function loadHabits() {
      const tbody = document.getElementById('habitTableBody');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      const filterType = document.getElementById('filterType').value;
      
      // Load saved habits or set up initial defaults
      let habits = JSON.parse(localStorage.getItem('myHabits'));
      if (!habits) {
        habits = defaultHabits;
        localStorage.setItem('myHabits', JSON.stringify(defaultHabits));
      }

      tbody.innerHTML = '';

      // Filter habits by search input and dropdown selection
      const filteredHabits = habits.filter(habit => {
        const matchesSearch = habit.name.toLowerCase().includes(searchQuery);
        const matchesType = (filterType === 'All') || (habit.type === filterType);
        return matchesSearch && matchesType;
      });

      if (filteredHabits.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-3">No habits found.</td></tr>`;
        return;
      }

      // Render filtered rows
      filteredHabits.forEach((habit) => {
        const badgeClass = habit.type === 'Good' ? 'bg-success' : 'bg-danger';
        
        tbody.innerHTML += `
          <tr>
            <td class="fw-medium">${habit.name}</td>
            <td><span class="badge ${badgeClass}">${habit.type}</span></td>
            <td>
              <button class="btn btn-sm btn-light" onclick="deleteHabit(${habit.id})">
                <i class="fa-solid fa-trash text-danger"></i>
              </button>
            </td>
          </tr>
        `;
      });
    }

    function deleteHabit(habitId) {
      let habits = JSON.parse(localStorage.getItem('myHabits')) || [];
      habits = habits.filter(h => h.id !== habitId); // Remove habit by ID
      localStorage.setItem('myHabits', JSON.stringify(habits)); // Update storage
      loadHabits(); // Refresh table view
    }

    // Run loadHabits on page initialization
    document.addEventListener('DOMContentLoaded', loadHabits);
  </script>

</body>
</html>
