<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Habit - Habit Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .sidebar { min-height: calc(100vh - 56px); background: #ffffff; border-right: 1px solid #e9ecef; }
    .sidebar .nav-link { color: #495057; font-weight: 500; padding: 12px 20px; }
    .sidebar .nav-link.active { background: #eef2ff; color: #4361ee; border-radius: 6px; }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-square-check text-primary me-2"></i>HT Habit Tracker</a>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-3 col-lg-2 sidebar p-3">
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-house me-2"></i>Home</a></li>
          <li class="nav-item"><a class="nav-link" href="my-habits.html"><i class="fa-solid fa-list-check me-2"></i>My Habits</a></li>
          <li class="nav-item"><a class="nav-link active" href="add-habit.html"><i class="fa-solid fa-circle-plus me-2"></i>Add Habit</a></li>
          <li class="nav-item"><a class="nav-link" href="progress.html"><i class="fa-solid fa-chart-pie me-2"></i>Progress</a></li>
          <li class="nav-item mt-4"><a class="nav-link text-danger" href="index.html"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</a></li>
        </ul>
      </div>

      <div class="col-md-9 col-lg-10 p-4">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <div class="card border-0 shadow-sm p-4">
              <h3 class="fw-bold mb-4">Add New Habit</h3>
              <form id="addHabitForm" onsubmit="saveHabit(event)">
  <div class="mb-3">
    <label class="form-label">Habit Name:</label>
    <input type="text" id="habitName" class="form-control" placeholder="Enter Habit Name" required>
  </div>
  <div class="mb-3">
    <label class="form-label d-block">Habit Type:</label>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="habitType" id="typeGood" value="Good" checked>
      <label class="form-check-label text-success fw-bold" for="typeGood">Good Habit</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="habitType" id="typeBad" value="Bad">
      <label class="form-check-label text-danger fw-bold" for="typeBad">Bad Habit</label>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Category:</label>
    <select id="habitCategory" class="form-select" required>
      <option value="" selected disabled>Select Category</option>
      <option value="Health">Health</option>
      <option value="Productivity">Productivity</option>
      <option value="Fitness">Fitness</option>
    </select>
  </div>
  <div class="mb-4">
    <label class="form-label">Frequency:</label>
    <select id="habitFrequency" class="form-select">
      <option value="Daily" selected>Daily</option>
      <option value="Weekly">Weekly</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary w-100 py-2">Save Habit</button>
</form>

<script>
function saveHabit(event) {
  event.preventDefault(); // Stop default form submit

  // Get values from form
  const name = document.getElementById('habitName').value;
  const type = document.querySelector('input[name="habitType"]:checked').value;
  const category = document.getElementById('habitCategory').value;

  // Retrieve existing habits from localStorage or start empty
  let habits = JSON.parse(localStorage.getItem('myHabits')) || [
    { id: 1, name: 'Drink water', type: 'Good' },
    { id: 2, name: 'Exercise', type: 'Good' },
    { id: 3, name: 'Read book', type: 'Good' },
    { id: 4, name: 'Smoking', type: 'Bad' },
    { id: 5, name: 'Junk Food', type: 'Bad' },
    { id: 6, name: 'Social Media', type: 'Bad' }
  ];

  // Add the new habit
  habits.push({ id: Date.now(), name: name, type: type, category: category });

  // Save updated array back to browser storage
  localStorage.setItem('myHabits', JSON.stringify(habits));

  // Redirect to my-habits page
  window.location.href = 'my-habits.html';
}
</script>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
