<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Habit Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-square-check text-primary me-2"></i>HT Habit Tracker</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card border-0 shadow-sm p-4">
          <div class="text-center mb-4">
            <div class="bg-light rounded-circle d-inline-block p-3 mb-2">
              <i class="fa-solid fa-user-plus fa-2x text-secondary"></i>
            </div>
            <h4 class="fw-bold">Register</h4>
          </div>
          <form action="dashboard.html" method="GET">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="user@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="terms" required>
              <label class="form-check-label small text-muted" for="terms">I agree to terms</label>
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2">Register</button>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
